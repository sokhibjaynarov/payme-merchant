name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Payme.Merchant.sln

      - name: Build
        run: dotnet build Payme.Merchant.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Payme.Merchant.sln --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Payme.Merchant/Payme.Merchant.csproj --configuration Release --no-build --output ./artifacts

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
