name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Payme.Merchant.sln

      - name: Build
        run: dotnet build Payme.Merchant.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Payme.Merchant.sln --configuration Release --no-build --verbosity normal
